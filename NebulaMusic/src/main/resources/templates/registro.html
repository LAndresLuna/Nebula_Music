<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nébula Music - Registro</title>
    </head>
    <body>
        <main class="auth-container">

            <section class="auth-card">
                <form method="post" action="/crear-cuenta">

                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" minlength="3" placeholder="Escribe tu nombre">
                    </div>

                    <div class="form-group">
                        <label for="correo">Correo:</label>
                        <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com">
                    </div>

                    <div class="form-group">
                        <label for="contrasenia">Contraseña:</label>
                        <input type="password" id="contrasenia" name="contrasenia" placeholder="Tu contraseña">
                    </div>

                    <div class="form-group">
                        <label for="txt_pseudonimo">Pseudonimo:</label>
                        <input type="text" id="txt_pseudonimo" name="txt_pseudonimo" pattern="[a-zA-Z]{3,10}-[0-9]{2,10}" placeholder="Ej: andres-08">
                    </div>



                    <div class="form-group">
                        <label>Género</label>
                        <br>
                        <input type="radio" id="masculino" name="rad_genero" value="M">
                        <label for="masculino">Masculino</label>
                        <input type="radio" id="femenino" name="rad_genero" value="F">
                        <label for="femenino">Femenino</label>
                        <input type="radio" id="otro" name="rad_genero" value="O">
                        <label for="otro">Otro</label>
                    </div>

                    <div class="form-group">
                        <label for="suscripcion">Suscripción:</label>
                        <select id="suscripcion" name="sel_suscripcion">
                            <option value="gratis">Gratis</option>
                            <option value="mensual">Mensual</option>
                            <option value="anual">Anual</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="fechaNacimiento">Fecha Nacimiento:</label>
                        <input type="date" id="fechaNacimiento" name="fechaNacimiento">
                    </div>

                    <div class="form-group">
                        <label for="comentarios">Comentarios:</label>
                        <textarea id="comentarios" name="comentarios" rows="4" placeholder="Escribe tus comentarios..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="chk_terminos">Acepto los términos y condiciones</label>
                        <input type="checkbox" id="chk_terminos" name="chk_terminos">
                    </div>

                    <div class="form-group">
                        <button type="submit" class="btn-primary">Iniciar Sesión</button>
                        <button type="reset" class="btn-secondary">Cancelar</button>
                    </div>

                </form>
            </section>

        </main>
    </body>
</html>
